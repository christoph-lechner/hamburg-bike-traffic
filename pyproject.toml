[project]
name = "hh_bike_traffic"
version = "0.1.0"
license = " AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "requests",
    "pytest",
    "numpy",
    "matplotlib",
    "pandas",
    "geopandas",
    "jinja2",
    "psycopg[binary,pool]",
]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Note: conftest.py file excludes certain subdirs -- unless enabled by command line option
testpaths = ["tests"]
